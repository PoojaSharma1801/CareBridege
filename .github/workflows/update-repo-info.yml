name: Update Repository Info

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Update repository description and homepage
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          await github.rest.repos.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            description: "🏥 CareBridge - Healthcare Platform | 🌐 Live: https://poojasharma1801.github.io/CareBridege",
            homepage: "https://poojasharma1801.github.io/CareBridege",
            has_issues: true,
            has_projects: true,
            has_wiki: false
          });
